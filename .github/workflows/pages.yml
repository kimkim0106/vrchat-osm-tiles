name: タイルを焼いて Pages に配る

# 焼いた地域は Release (タグ = 版、例 v1) に <地域>.tar.gz として保存し、次からはそれを戻して配る。
# ワールドは manifest の頂点数を焼き込むので、同じ URL の中身を勝手に焼き直さない。
# 何を焼くかは plan_build.py が Release の一覧と regions.json から決める (その冒頭に条件):
#   v1 (POI なし、1 タイル = 1 画像) は「まだ Release に無い地域」と「手動実行で rebuild に指定した地域」だけ。
#   v2 (シート) は v1 から作る。「まだ Release に無い地域」と「v1 を焼き直した地域」。
#   v3 (POI 入りのシート) は v1 とは別に焼く。「まだ Release に無い地域」と「rebuild に指定した地域」。同じ job で v1 も焼くなら MBTiles を使い回す。
#   v4 (タイルの形式 2 = 共有の字のアトラスの番号で持つ POI 入りのシート) も同じ条件。ただし地域をまたいで同じタイルを
#   1 回だけ焼く (vmt_v4.py) ので 3 段に分ける: bake job でラベルの候補を集め (MBTiles は使い回す)、labels job で全地域の
#   ラベルをまとめて置き、glyph job (地域ごと) でその地域が持ち主のタイルだけを焼いて Release に保存する。
#   作る版は regions.json の dists と releaseOnly (releaseOnly は Release に保存するが配らない)。
#
# job: plan (焼く地域を決め、Release が無ければ作る) → bake (地域ごとの matrix。焼いて Release に保存)
#      → labels (v4 のラベルを置く) → glyph (v4 を地域ごとに焼いて Release に保存)
#      → publish (Release から戻して索引を作り、R2 に上げ、Pages の成果物を作る) → deploy → check
# bake の地域が 1 つ失敗しても、ほかの地域は焼いて保存する (fail-fast: false)。そのときは publish に進まないので、
# 「Re-run failed jobs」で失敗した地域だけ焼き直す (保存済みの地域は、次の実行の plan でも焼かない)。
#
# regions.json で "host": "r2" の地域は Pages に載せず、Cloudflare R2 に上げる (r2_upload.py)。
#   Secrets: R2_ACCOUNT_ID / R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY、Variables: R2_BUCKET / R2_PUBLIC_URL
#   これが無いときは R2 に上げる手順と確認を飛ばす (焼いて Release に保存するところまではやる)。

on:
  push:
    branches: [main]
    paths:
      - vmt_bake.py
      - vmt_pack.py
      - vmt_v4.py
      - vmt_bingroup.py
      - glyphs_v4.txt
      - build_site.py
      - plan_build.py
      - check_site.py
      - r2_upload.py
      - regions.json
      - labels/**
      - tools/**
      - requirements.txt
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: "焼き直す地域 (カンマ区切り、all で全部)。焼き直すと、その地域を使う既存のワールドは manifest を入れ替えて上げ直す必要がある"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PLANETILER_VERSION: 0.10.2
  PLANETILER_SHA256: f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d
  NOTO_TAG: Sans2.004
  NOTO_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a

# 実行環境は Ubuntu 26.04 を名前で指定する (ubuntu-latest は 2026-11-19 までに 26.04 へ移る。actions/runner-images#14748)。
# 次に ubuntu-latest が移るときに、気づかないうちに環境が変わらないように。Python と Java は setup-python / setup-java で、
# Python のパッケージは requirements.txt で版を決めているので、OS が変わっても焼いた結果は変わらない見込み。
# (2026-11-16 までに焼いた地域は 24.04。)

jobs:
  plan:
    runs-on: ubuntu-26.04
    permissions:
      contents: write   # Release を作る (bake の job が同時に作り合わないよう、ここでだけ作る)
    env:
      GH_TOKEN: ${{ github.token }}
      REBUILD: ${{ inputs.rebuild }}
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      count: ${{ steps.plan.outputs.count }}
      made: ${{ steps.plan.outputs.made }}
      glyph_matrix: ${{ steps.plan.outputs.glyph_matrix }}
      glyph_count: ${{ steps.plan.outputs.glyph_count }}
      glyph_released: ${{ steps.plan.outputs.glyph_released }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: 焼く地域を決める
        id: plan
        run: |
          set -euo pipefail
          python plan_build.py released > released.json
          cat released.json
          python plan_build.py plan released.json --rebuild "$REBUILD" > plan.json
          python -m json.tool plan.json
          {
            echo "matrix=$(python -c 'import json; print(json.dumps(json.load(open("plan.json"))["matrix"]))')"
            echo "count=$(python -c 'import json; print(json.load(open("plan.json"))["count"])')"
            echo "made=$(python -c 'import json; print(json.load(open("plan.json"))["made"])')"
            echo "glyph_matrix=$(python -c 'import json; print(json.dumps(json.load(open("plan.json"))["glyph_matrix"]))')"
            echo "glyph_count=$(python -c 'import json; print(json.load(open("plan.json"))["glyph_count"])')"
            echo "glyph_released=$(python -c 'import json; print(json.load(open("plan.json"))["glyph_released"])')"
          } >> "$GITHUB_OUTPUT"
          for dist in $(python -c 'import json; print(" ".join(json.load(open("plan.json"))["releases"]))'); do
            gh release create "$dist" --target "$GITHUB_SHA" --title "$dist の地域" \
              --notes "VMT-DT $dist の地域。<地域>.tar.gz を site/ に展開すると $dist/<地域>/ になる。Actions がこれを戻して Pages に配る。"
            echo "Release $dist を作った"
          done

  # 1 地域 = 1 job。焼いた版ごとにすぐ Release に保存する (途中で止まっても、保存した版は次の実行で焼かない)
  bake:
    needs: plan
    if: needs.plan.outputs.count != '0'
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: write   # Release に焼いた地域を保存する
    strategy:
      fail-fast: false
      max-parallel: 3   # Geofabrik は続けて取ると接続を拒むことがある
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    name: bake (${{ matrix.name }})
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ matrix.name }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      # 元データ (名古屋は japan 全体)、MBTiles、焼いたタイル、tar.gz でディスクが要るので、使わない道具を消して空ける
      - if: matrix.build || matrix.poi || matrix.glyph
        name: ディスクを空ける
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - if: matrix.build || matrix.poi || matrix.glyph
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - run: pip install -r requirements.txt

      - if: matrix.build || matrix.poi || matrix.glyph
        name: 道具のキャッシュ
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-planetiler-${{ env.PLANETILER_VERSION }}-noto-${{ env.NOTO_TAG }}

      - if: matrix.build || matrix.poi || matrix.glyph
        name: planetiler とフォントを取ってくる
        run: |
          mkdir -p build/tools
          cd build/tools
          [ -f planetiler.jar ] || curl -fsSL -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/v${PLANETILER_VERSION}/planetiler.jar"
          [ -f NotoSansCJK-Regular.ttc ] || curl -fsSL -o NotoSansCJK-Regular.ttc \
            "https://github.com/notofonts/noto-cjk/raw/${NOTO_TAG}/Sans/OTC/NotoSansCJK-Regular.ttc"
          printf '%s  planetiler.jar\n%s  NotoSansCJK-Regular.ttc\n' "$PLANETILER_SHA256" "$NOTO_SHA256" | sha256sum -c -

      # OSM の元データ (Geofabrik の地域ごとの .osm.pbf) を地域と日付ごとにキャッシュする。同じ地域の都市が多いので、
      # Geofabrik に取りに行く回数を減らす (続けて取ると接続を拒まれる)。今日のものが無ければ build_site.py が取り、
      # どこからも取れなければ restore-keys で戻した前の日までのものを使う (build_site.py の fetch_osm)
      - if: matrix.build || matrix.poi || matrix.glyph
        name: 元データの地域
        id: osm
        run: |
          set -euo pipefail
          area=$(python -c 'import json, os; print(next(r["area"] for r in json.load(open("regions.json"))["regions"] if r["name"] == os.environ["N"]))')
          echo "area=$area" >> "$GITHUB_OUTPUT"
          echo "date=$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"

      - if: matrix.build || matrix.poi || matrix.glyph
        name: 元データのキャッシュ
        uses: actions/cache@v6
        with:
          path: build/osm-cache/${{ steps.osm.outputs.area }}
          key: osm-${{ steps.osm.outputs.area }}-${{ steps.osm.outputs.date }}
          restore-keys: osm-${{ steps.osm.outputs.area }}-

      - name: 焼いて Release に保存する
        env:
          BUILD: ${{ matrix.build }}
          PACK: ${{ matrix.pack }}
          POI: ${{ matrix.poi }}
          GLYPH: ${{ matrix.glyph }}
          GLYPH_RELEASED: ${{ needs.plan.outputs.glyph_released }}
        run: |
          set -euo pipefail
          dist=$(python -c 'import build_site; print(build_site.DIST)')
          sheet_dist=$(python -c 'import build_site; print(build_site.SHEET_DIST)')
          poi_dist=$(python -c 'import build_site; print(build_site.POI_DIST)')
          mkdir -p site pack
          save() {
            local d=$1
            tar -czf "pack/$N.tar.gz" -C site "$d/$N"
            gh release upload "$d" "pack/$N.tar.gz" --clobber
            rm "pack/$N.tar.gz"
            echo "$N: $d を Release に保存した"
          }
          if [ "$BUILD" = true ]; then
            python build_site.py --tools build/tools --work build --site site --jobs "$(nproc)" --only "$N"
            save "$dist"
          fi
          if [ "$PACK" = true ]; then
            if [ "$BUILD" != true ]; then
              # v1 は Release にあるので戻してからまとめる
              gh release download "$dist" --dir dl --pattern "$N.tar.gz"
              tar -xzf "dl/$N.tar.gz" -C site
            fi
            python build_site.py --site site --pack "$N"
            save "$sheet_dist"
          fi
          if [ "$POI" = true ]; then
            # v1 を焼いたときの MBTiles があれば使い回す (無ければ planetiler から)
            given=()
            [ -f "build/$N.mbtiles" ] && given=(--mbtiles "$N=build/$N.mbtiles")
            python build_site.py --tools build/tools --work build --site site --jobs "$(nproc)" --only "$N" --poi "${given[@]}"
            save "$poi_dist"
          fi
          if [ "$GLYPH" = true ]; then
            # v4 はここではラベルの候補を集めるだけ (焼くのは glyph job)。MBTiles は使い回し、glyph job に渡す
            given=()
            [ -f "build/$N.mbtiles" ] && given=(--mbtiles "$N=build/$N.mbtiles")
            python vmt_v4.py candidates --region "$N" --released "$GLYPH_RELEASED" --tools build/tools --work build \
              --out v4/cands "${given[@]}"
            mkdir -p v4/mbtiles
            mv "build/$N.mbtiles" "v4/mbtiles/$N.mbtiles"
          fi
          df -h / | tail -1

      - if: matrix.glyph
        uses: actions/upload-artifact@v7
        with:
          name: v4-cands-${{ matrix.name }}
          path: v4/cands/
          retention-days: 3

      - if: matrix.glyph
        uses: actions/upload-artifact@v7
        with:
          name: v4-mbtiles-${{ matrix.name }}
          path: v4/mbtiles/
          retention-days: 3
          compression-level: 0

  # v4: この実行で焼く地域のラベルの候補をすべて合わせて置く (持ち主の境目で重ならないように)。
  # Release にある地域の置いたラベル (<地域>.labels.json.gz) は動かさず、先に置いてあるものとして扱う
  labels:
    needs: [plan, bake]
    if: ${{ !cancelled() && needs.plan.outputs.glyph_count != '0' && needs.bake.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      GLYPH_RELEASED: ${{ needs.plan.outputs.glyph_released }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - run: pip install -r requirements.txt

      # ラベルの字の幅を測るのにフォントが要る
      - name: 道具のキャッシュ
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-planetiler-${{ env.PLANETILER_VERSION }}-noto-${{ env.NOTO_TAG }}

      - name: フォントを取ってくる
        run: |
          mkdir -p build/tools
          cd build/tools
          [ -f NotoSansCJK-Regular.ttc ] || curl -fsSL -o NotoSansCJK-Regular.ttc \
            "https://github.com/notofonts/noto-cjk/raw/${NOTO_TAG}/Sans/OTC/NotoSansCJK-Regular.ttc"
          printf '%s  NotoSansCJK-Regular.ttc\n' "$NOTO_SHA256" | sha256sum -c -

      - uses: actions/download-artifact@v8
        with:
          pattern: v4-cands-*
          path: v4/cands
          merge-multiple: true

      - name: ラベルを置く
        run: |
          set -euo pipefail
          mkdir -p v4/frozen
          if [ -n "$GLYPH_RELEASED" ]; then
            gh release download v4 --dir v4/frozen --pattern '*.labels.json.gz'
          fi
          python vmt_v4.py labels --released "$GLYPH_RELEASED" --tools build/tools \
            --cands v4/cands --frozen v4/frozen --plans v4/plans

      - uses: actions/upload-artifact@v7
        with:
          name: v4-plans
          path: v4/plans/
          retention-days: 3

  # v4: 地域ごとに、その地域が持ち主のタイルだけを置いたラベルで焼き、Release に保存する
  glyph:
    needs: [plan, labels]
    if: ${{ !cancelled() && needs.labels.result == 'success' }}
    runs-on: ubuntu-26.04
    timeout-minutes: 180
    permissions:
      contents: write   # Release に焼いた地域を保存する
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix: ${{ fromJSON(needs.plan.outputs.glyph_matrix) }}
    name: glyph (${{ matrix.name }})
    env:
      GH_TOKEN: ${{ github.token }}
      N: ${{ matrix.name }}
      GLYPH_RELEASED: ${{ needs.plan.outputs.glyph_released }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - run: pip install -r requirements.txt

      - name: 道具のキャッシュ
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-planetiler-${{ env.PLANETILER_VERSION }}-noto-${{ env.NOTO_TAG }}

      - name: フォントを取ってくる
        run: |
          mkdir -p build/tools
          cd build/tools
          [ -f NotoSansCJK-Regular.ttc ] || curl -fsSL -o NotoSansCJK-Regular.ttc \
            "https://github.com/notofonts/noto-cjk/raw/${NOTO_TAG}/Sans/OTC/NotoSansCJK-Regular.ttc"
          printf '%s  NotoSansCJK-Regular.ttc\n' "$NOTO_SHA256" | sha256sum -c -

      - uses: actions/download-artifact@v8
        with:
          name: v4-mbtiles-${{ matrix.name }}
          path: v4/mbtiles

      - uses: actions/download-artifact@v8
        with:
          name: v4-plans
          path: v4/plans

      - name: 焼いて Release に保存する
        run: |
          set -euo pipefail
          dist=$(python -c 'import build_site; print(build_site.GLYPH_DIST)')
          python vmt_v4.py bake --region "$N" --released "$GLYPH_RELEASED" --mbtiles "$N=v4/mbtiles/$N.mbtiles" \
            --plans v4/plans --site site --tools build/tools --work build --jobs "$(nproc)"
          mkdir -p pack
          tar -czf "pack/$N.tar.gz" -C site "$dist/$N"
          cp "site/$dist/$N/own/labels.json.gz" "pack/$N.labels.json.gz"
          gh release upload "$dist" "pack/$N.tar.gz" "pack/$N.labels.json.gz" --clobber
          echo "$N: $dist を Release に保存した"

  # Release からすべての版を戻して (配らない版は戻さない)、索引を作り、R2 と Pages に出す
  publish:
    needs: [plan, bake, labels, glyph]
    # bake が無い (焼く地域が無い) ときも出す。bake / labels / glyph のどれかが失敗したら出さない (Re-run failed jobs で続きから)
    if: >-
      ${{ !cancelled() && needs.plan.result == 'success'
      && (needs.bake.result == 'success' || needs.bake.result == 'skipped')
      && (needs.labels.result == 'success' || needs.labels.result == 'skipped')
      && (needs.glyph.result == 'success' || needs.glyph.result == 'skipped') }}
    runs-on: ubuntu-26.04
    timeout-minutes: 240   # 地域が 47 あり、新しい地域を R2 に上げると 1 地域 1.5 分ほどかかる
    env:
      GH_TOKEN: ${{ github.token }}
      R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
      R2_BUCKET: ${{ vars.R2_BUCKET }}
      R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
    outputs:
      pages_dists: ${{ steps.index.outputs.pages_dists }}
      r2_dists: ${{ steps.index.outputs.r2_dists }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"

      - name: 保存してある地域を戻す
        run: |
          set -euo pipefail
          mkdir -p site dl
          python plan_build.py released > released.json
          python plan_build.py restore released.json > restore.txt
          while read -r tag n; do
            echo "restore $tag/$n"
            gh release download "$tag" --dir dl --pattern "$n.tar.gz" --clobber
            tar -xzf "dl/$n.tar.gz" -C site
            rm "dl/$n.tar.gz"
          done < restore.txt
          df -h / | tail -1

      # まとめた .bin (vmt_bingroup.py) を作るのに numpy と Pillow が要る
      - run: pip install -r requirements.txt

      # dists を指定した地域は、その版だけを配る (Release には全部の版を保存してある)
      # host が r2 の地域は r2site/ に移す (Pages には載せない)
      # binGroups の地域は、まとめた .bin を r2site/ に作る (Pages の地域も R2 に置く)。R2 が無ければ作らない
      - name: 索引を作る
        id: index
        run: |
          set -euo pipefail
          groups=()
          if [ -n "$R2_ACCOUNT_ID" ] && [ -n "$R2_BUCKET" ] && [ -n "$R2_PUBLIC_URL" ]; then
            groups=(--bin-groups "$R2_PUBLIC_URL")
          fi
          python build_site.py --site site --index-only --prune --r2 r2site "${groups[@]}"
          du -sh r2site
          # 地域が 1 つでもある版だけを配信後に確かめる
          echo "pages_dists=$(python plan_build.py dists site)" >> "$GITHUB_OUTPUT"
          echo "r2_dists=$(python plan_build.py dists r2site)" >> "$GITHUB_OUTPUT"

      # R2 に上げるのは、この実行で作った版と地域と、R2 にまだ無い地域だけ (manifest.json の有無で見る)
      - name: R2 に上げる
        if: env.R2_ACCOUNT_ID != '' && env.R2_BUCKET != ''
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          MADE: ${{ needs.plan.outputs.made }}
        run: python r2_upload.py r2site --force "$MADE"

      - name: R2 の設定が無い
        if: env.R2_ACCOUNT_ID == '' || env.R2_BUCKET == ''
        run: echo "::warning::R2 の Secrets / Variables が無いので、host が r2 の地域は上げていない (Release には保存した)"

      # 人が使う Web のツール (ログからペンの線の GeoJSON を取り出すなど)。地域の版と同じサイトに置く
      - name: ツールを置く
        run: cp -R tools site/tools

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  # bake が飛ばされた (焼く地域が無い) 実行でも出す。GitHub は飛ばされた job の後ろの job を、if に状態の関数が
  # 無ければ全部飛ばすので、publish の結果だけを見る
  deploy:
    needs: publish
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # VRChat はリダイレクトを読めないので、配信後に実際の URL で確かめる
  check:
    needs: [publish, deploy]
    if: ${{ !cancelled() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - name: ツールのページを確かめる
        run: curl -fsS -o /dev/null -w '%{http_code} %{url_effective}\n' "${{ needs.deploy.outputs.page_url }}tools/ink-geojson/"
      - if: needs.publish.outputs.pages_dists != ''
        run: python check_site.py --dists "${{ needs.publish.outputs.pages_dists }}" "${{ needs.deploy.outputs.page_url }}"
      - name: R2 を確かめる
        if: vars.R2_PUBLIC_URL != '' && needs.publish.outputs.r2_dists != ''
        run: python check_site.py --dists "${{ needs.publish.outputs.r2_dists }}" "${{ vars.R2_PUBLIC_URL }}"
