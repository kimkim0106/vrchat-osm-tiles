name: タイルを焼いて Pages に配る

# 焼いた地域は Release (タグ = 版、例 v1) に <地域>.tar.gz として保存し、次からはそれを戻して配る。
# ワールドは manifest の頂点数を焼き込むので、同じ URL の中身を勝手に焼き直さない。
# v1 (1 タイル = 1 画像) を焼くのは「まだ Release に無い地域」と「手動実行で rebuild に指定した地域」だけ。
# v2 (シート) は v1 から作る。作るのは「まだ Release に無い地域」と「v1 を焼き直した地域」と「rebuild に指定した地域」。

on:
  push:
    branches: [main]
    paths:
      - vmt_bake.py
      - vmt_pack.py
      - build_site.py
      - check_site.py
      - regions.json
      - requirements.txt
      - .github/workflows/pages.yml
  workflow_dispatch:
    inputs:
      rebuild:
        description: "焼き直す地域 (カンマ区切り、all で全部)。焼き直すと、その地域を使う既存のワールドは manifest を入れ替えて上げ直す必要がある"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

env:
  PLANETILER_VERSION: 0.10.2
  PLANETILER_SHA256: f310bd0413e2e4512b27f4046d418664e8e1d3bf31603c2a70e23de06c167e4d
  NOTO_TAG: Sans2.004
  NOTO_SHA256: b76b0433203017ca80401b2ee0dd69350349871c4b19d504c34dbdd80541690a

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      contents: write   # Release に焼いた地域を保存する
    env:
      GH_TOKEN: ${{ github.token }}
      REBUILD: ${{ inputs.rebuild }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
          cache: pip

      - name: 保存してある地域を戻す
        id: plan
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p site dl
          dist=$(python -c 'import build_site; print(build_site.DIST)')
          for tag in $(gh release list --limit 100 --json tagName --jq '.[].tagName | select(test("^v[0-9]+$"))'); do
            gh release download "$tag" --dir "dl/$tag" --pattern '*.tar.gz'
            for f in dl/"$tag"/*.tar.gz; do
              echo "restore $f"
              tar -xzf "$f" -C site
            done
          done
          sheet_dist=$(python -c 'import build_site; print(build_site.SHEET_DIST)')
          build=""
          pack=""
          for n in $(python -c 'import json; print(" ".join(r["name"] for r in json.load(open("regions.json"))["regions"]))'); do
            forced=0
            if [ "$REBUILD" = all ] || [[ ",${REBUILD// /}," == *",$n,"* ]]; then forced=1; fi
            if [ $forced = 1 ] || [ ! -f "site/$dist/$n/manifest.json" ]; then
              build="$build $n"
              pack="$pack $n"
            elif [ ! -f "site/$sheet_dist/$n/manifest.json" ]; then
              pack="$pack $n"
            fi
          done
          build="${build# }"
          pack="${pack# }"
          echo "焼く地域 ($dist): ${build:-なし}"
          echo "まとめる地域 ($sheet_dist): ${pack:-なし}"
          echo "dist=$dist" >> "$GITHUB_OUTPUT"
          echo "sheet_dist=$sheet_dist" >> "$GITHUB_OUTPUT"
          echo "build=$build" >> "$GITHUB_OUTPUT"
          echo "pack=$pack" >> "$GITHUB_OUTPUT"

      - if: steps.plan.outputs.build != ''
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - if: steps.plan.outputs.build != '' || steps.plan.outputs.pack != ''
        run: pip install -r requirements.txt

      - if: steps.plan.outputs.build != ''
        name: 道具のキャッシュ
        uses: actions/cache@v6
        with:
          path: build/tools
          key: tools-planetiler-${{ env.PLANETILER_VERSION }}-noto-${{ env.NOTO_TAG }}

      - if: steps.plan.outputs.build != ''
        name: planetiler とフォントを取ってくる
        run: |
          mkdir -p build/tools
          cd build/tools
          [ -f planetiler.jar ] || curl -fsSL -o planetiler.jar \
            "https://github.com/onthegomap/planetiler/releases/download/v${PLANETILER_VERSION}/planetiler.jar"
          [ -f NotoSansCJK-Regular.ttc ] || curl -fsSL -o NotoSansCJK-Regular.ttc \
            "https://github.com/notofonts/noto-cjk/raw/${NOTO_TAG}/Sans/OTC/NotoSansCJK-Regular.ttc"
          printf '%s  planetiler.jar\n%s  NotoSansCJK-Regular.ttc\n' "$PLANETILER_SHA256" "$NOTO_SHA256" | sha256sum -c -

      - if: steps.plan.outputs.build != ''
        name: 地域を焼く
        env:
          BUILD: ${{ steps.plan.outputs.build }}
        run: |
          set -euo pipefail
          args=()
          for n in $BUILD; do args+=(--only "$n"); done
          python build_site.py --tools build/tools --work build --site site --jobs "$(nproc)" "${args[@]}"

      - if: steps.plan.outputs.pack != ''
        name: v1 をシートにまとめる (v2)
        env:
          PACK: ${{ steps.plan.outputs.pack }}
        run: |
          set -euo pipefail
          args=()
          for n in $PACK; do args+=(--pack "$n"); done
          python build_site.py --site site "${args[@]}"

      - if: steps.plan.outputs.build != '' || steps.plan.outputs.pack != ''
        name: 作った地域を Release に保存する
        env:
          BUILD: ${{ steps.plan.outputs.build }}
          PACK: ${{ steps.plan.outputs.pack }}
          DIST: ${{ steps.plan.outputs.dist }}
          SHEET_DIST: ${{ steps.plan.outputs.sheet_dist }}
        run: |
          set -euo pipefail
          save() {
            local dist=$1; shift
            gh release view "$dist" >/dev/null 2>&1 || gh release create "$dist" --target "$GITHUB_SHA" \
              --title "$dist の地域" --notes "VMT-DT $dist の地域。<地域>.tar.gz を site/ に展開すると $dist/<地域>/ になる。Actions がこれを戻して Pages に配る。"
            mkdir -p "pack/$dist"
            for n in "$@"; do
              tar -czf "pack/$dist/$n.tar.gz" -C site "$dist/$n"
              gh release upload "$dist" "pack/$dist/$n.tar.gz" --clobber
            done
          }
          [ -z "$BUILD" ] || save "$DIST" $BUILD
          [ -z "$PACK" ] || save "$SHEET_DIST" $PACK

      - name: 索引を作る
        run: python build_site.py --site site --index-only

      - uses: actions/upload-pages-artifact@v5
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5

  # VRChat はリダイレクトを読めないので、配信後に実際の URL で確かめる
  check:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.15"
      - run: python check_site.py "${{ needs.deploy.outputs.page_url }}"
